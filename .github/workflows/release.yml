name: Package release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v1.2.0)
        required: true
        type: string
      amend_release:
        description: Replace the existing tag and release downloads with this branch's commit
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      AMEND_RELEASE: ${{ inputs.amend_release || false }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.amend_release && github.sha || github.event.release.tag_name || inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Validate version tag
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('src/manifest.json').read_text(encoding='utf-8-sig'))['version']
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+(?:\.[0-9]+){1,3}', tag) or tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match manifest version v{version}')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'VERSION={version}\n')
          PY
          if [ "$AMEND_RELEASE" != "true" ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi

      - name: Build browser packages
        run: python3 build.py

      - name: Verify packages and checksums
        run: |
          python3 tests/packages.py
          cd ..
          sha256sum --check kakomi-checksums.txt

      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Kakomi 1.3.1 fixes screenshot destination settings. Options now has one Open preview page switch: off copies to the clipboard, while on opens the preview. Legacy conflicting values are normalized, and failed clipboard copies still fall back to the preview.

          Capture a highlighted webpage element with a click, or drag to capture an area.

          ### Downloads
          - **Chrome ZIP:** extract it, open chrome://extensions, enable Developer mode, and choose Load unpacked.
          - **Firefox ZIP / unsigned XPI:** development packages. For temporary testing, extract the ZIP and load manifest.json via about:debugging → This Firefox → Load Temporary Add-on. Permanent installation in standard Firefox requires Mozilla signing.
          - **Source ZIP:** complete source and generated browser folders.
          - **Checksums:** SHA-256 hashes for all four archives.

          Requires Chrome 116+ or Firefox Desktop 140+. Captures the visible portion of the page; screenshots stay on your device.
          NOTES
          assets=(
            "../kakomi-chrome-$VERSION.zip"
            "../kakomi-firefox-$VERSION.zip"
            "../kakomi-firefox-$VERSION-unsigned.xpi"
            "../kakomi-source-$VERSION.zip"
            "../kakomi-checksums.txt"
          )
          if [ "$AMEND_RELEASE" = "true" ]; then
            # Explicit manual mode only: keep an existing release's tag and all
            # downloadable sources aligned with the newly tested package commit.
            gh release view "$RELEASE_TAG" > /dev/null
            previous=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            current=$(git rev-parse HEAD)
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$current" -F force=true > /dev/null
            printf 'Amended %s: %s -> %s\n' "$RELEASE_TAG" "$previous" "$current" >> "$GITHUB_STEP_SUMMARY"
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
              --title "Kakomi $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
